<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка VPN конфигурации</title>
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #1c1c1e; font-family: -apple-system, sans-serif; }
        .btn { display: inline-flex; align-items: center; padding: 16px 32px; background: #007aff; color: white; text-decoration: none; border-radius: 14px; font-weight: 600; font-size: 18px; cursor: pointer; border: none; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .alert { display: none; margin-top: 20px; color: #34c759; font-weight: bold; text-align: center; font-size: 16px; padding: 10px; background: rgba(52, 199, 89, 0.1); border-radius: 8px; }
    </style>
</head>
<body>
    <button class="btn" onclick="copyLink()">📋 Скопировать ссылку подписки</button>
    <div class="alert" id="successMsg">Ссылка скопирована!<br>Теперь просто откройте приложение Happ.</div>

    <script>
        function copyLink() {
            navigator.clipboard.writeText("https://github.io");
            document.getElementById("successMsg").style.display = "block";
        }
    </script>
</body>
</html>
