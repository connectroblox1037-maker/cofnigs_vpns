<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #ffffff;
            --text-sub: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .dashboard {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Верхняя панель со ссылками */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: #12b5cb;
        }

        .logo-icon {
            display: flex;
            gap: 3px;
            align-items: center;
        }

        .logo-icon div {
            width: 3px;
            background-color: #12b5cb;
            border-radius: 2px;
        }
        .logo-icon div:nth-child(1) { height: 12px; }
        .logo-icon div:nth-child(2) { height: 22px; }
        .logo-icon div:nth-child(3) { height: 16px; }
        .logo-icon div:nth-child(4) { height: 10px; }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        /* Единственная активная кнопка копирования */
        .action-btn {
            background: #1f242c;
            border: 1px solid #30363d;
            border-radius: 10px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
        }

        .action-btn:hover {
            background: #262c36;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #8b949e;
            stroke-width: 2;
        }

        /* Неактивная кнопка самолетика (просто декор) */
        .action-btn-disabled {
            background: #1f242c;
            border: 1px solid #30363d;
            border-radius: 10px;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .action-btn-disabled svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #229ED9;
            stroke-width: 2;
        }

        /* Карточка профиля */
        .user-card {
            background-color: var(--card-bg);
            border: 1px solid #21262d;
            border-radius: 20px;
            padding: 20px;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(46, 160, 67, 0.15);
            border: 1px solid #2ea043;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .status-badge svg {
            width: 18px;
            height: 18px;
            stroke: #34c759;
            stroke-width: 3;
            fill: none;
        }

        .user-info h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .user-info p {
            margin: 3px 0 0 0;
            font-size: 13px;
            color: var(--text-sub);
        }

        /* Сетка характеристик */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-box {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 14px;
            padding: 12px;
        }

        .stat-box {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 14px;
            padding: 12px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 600;
        }

        /* Раздел Установка */
        .install-section h3 {
            font-size: 22px;
            margin: 10px 0 15px 5px;
            font-weight: 700;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Статичные плашки приложений без кликов */
        .app-item-static {
            background-color: var(--card-bg);
            border: 1px solid #21262d;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 15px;
            pointer-events: none;
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-sub);
            opacity: 0.2;
        }

        .dot-indicator {
            width: 6px;
            height: 6px;
            background-color: #dda15e;
            border-radius: 50%;
        }

        /* Уведомление */
        .toast {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ea043;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.1);
            animation: popUp 0.2s ease-out;
        }

        @keyframes popUp {
            from { transform: translate(-50%, 15px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Верхняя плашка -->
        <div class="header-panel">
            <div class="logo-area">
                <div class="logo-icon">
                    <div></div><div></div><div></div><div></div>
                </div>
                <span>Subscription</span>
            </div>
            <div class="action-buttons">
                <!-- РАБОЧАЯ КНОПКА КОПИРОВАНИЯ -->
                <div class="action-btn" onclick="copyLink()" title="Скопировать ссылку подписки">
                    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </div>
                <!-- ПРОСТО ДЕКОР -->
                <div class="action-btn-disabled">
                    <svg viewBox="0 0 24 24"><path d="M21.5 2L2 11.5l6.8 2.7L18.5 6l-8.3 8.9M10.2 21.8l.8-4.3L19 7"></path></svg>
                </div>
            </div>
        </div>

        <!-- Информация о юзере -->
        <div class="user-card">
            <div class="user-header">
                <div class="status-badge">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <div class="user-info">
                    <h2>user_7832139670</h2>
                    <p>Истекает через месяц</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">🆔 Имя пользователя</div>
                    <div class="stat-value">user_7832139670</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">✓ Статус</div>
                    <div class="stat-value" style="color: #2ea043;">Активна</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">📅 Истекает</div>
                    <div class="stat-value">22 октября, 2026</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">⇅ Трафик</div>
                    <div class="stat-value">768.35 MiB / ∞</div>
                </div>
            </div>
        </div>

        <!-- Раздел Установка платформ (Статичные декоративные блоки) -->
        <div class="install-section">
            <h3>Установка</h3>
            <div class="apps-grid">
                <div class="app-item-static">
                    <div class="app-left">
                        <div class="dot-indicator"></div>
                        <span>Happ</span>
                    </div>
                    <div class="app-logo">H</div>
                </div>
                <div class="app-item-static">
                    <div class="app-left">
                        <span>FlClashX</span>
                    </div>
                    <div class="app-logo">X</div>
                </div>
                <div class="app-item-static">
                    <div class="app-left">
                        <span>Koala Clash</span>
                    </div>
                    <div class="app-logo">🐨</div>
                </div>
                <div class="app-item-static">
                    <div class="app-left">
                        <span>Prizrak-Box</span>
                    </div>
                    <div class="app-logo">Ghost</div>
                </div>
                <div class="app-item-static">
                    <div class="app-left">
                        <span>Throne</span>
                    </div>
                    <div class="app-logo">👑</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Ссылка скопирована в буфер обмена!</div>

    <script>
        function copyLink() {
            const link = "https://connectroblox1037-maker.github.io/cofnigs_vpns/VPNS.txt";
            
            navigator.clipboard.writeText(link).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 2000);
            });
        }
    </script>
</body>
</html>
