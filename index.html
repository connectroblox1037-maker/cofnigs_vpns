<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Наш приватный VPN вайб</title>
    <style>
        /* Вайбовый футуристичный градиент */
        body { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #080710;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Светящиеся неоновые сферы на фоне для атмосферы */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
        }
        .orb-1 {
            width: 350px;
            height: 350px;
            background: linear-gradient(#185a9d, #0c2540);
            top: -10%;
            left: -10%;
            animation: float-1 12s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(#7f00ff, #ff007f);
            bottom: -5%;
            right: -5%;
            animation: float-2 10s ease-in-out infinite alternate;
        }

        @keyframes float-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }
        @keyframes float-2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, -40px) scale(1.2); }
        }

        /* Glassmorphism карточка по канону */
        .glass-card {
            z-index: 2;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin: 0 0 30px 0;
            line-height: 1.5;
        }

        /* Кибер-кнопка со статусным свечением */
        .btn-glow { 
            width: 100%;
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 10px;
            padding: 16px 24px; 
            background: #fff; 
            color: #000; 
            text-decoration: none; 
            border-radius: 16px; 
            font-weight: 600; 
            font-size: 16px; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 4px 30px rgba(255, 255, 255, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
            background: #f5f5f7;
        }

        .btn-glow:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Сочное и плавное поп-ап уведомление */
        .toast { 
            display: none; 
            margin-top: 25px; 
            color: #34c759; 
            font-weight: 600; 
            font-size: 15px; 
            padding: 14px 20px; 
            background: rgba(52, 199, 89, 0.1); 
            border: 1px solid rgba(52, 199, 89, 0.2);
            border-radius: 14px; 
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .toast-subtext {
            font-size: 13px; 
            color: rgba(255, 255, 255, 0.4); 
            font-weight: 400; 
            margin-top: 4px; 
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card">
        <h1>Твой личный VPN кокон</h1>
        <p>Копируй конфиг в один тап и забирай фулл доступ к свободной сети</p>
        
        <button class="btn-glow" onclick="copyVibeLink()">
            <span>⚡ Скопировать подписку</span>
        </button>
        
        <div class="toast" id="vibeToast">
            💫 Конфиг улетел в буфер!
            <span class="toast-subtext">Открывай Happ, прыгай в [+] и вставляй URL подписки.</span>
        </div>
    </div>

    <script>
        function copyVibeLink() {
            navigator.clipboard.writeText("https://github.io");
            document.getElementById("vibeToast").style.display = "block";
        }
    </script>
</body>
</html>
